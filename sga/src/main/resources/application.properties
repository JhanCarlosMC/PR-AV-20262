spring.application.name=sga

# --- Base de datos H2 en memoria (Guía 03) ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (Guía 03) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA (Guía 03) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor (Guía 03) ---
server.port=8080

# --- OpenAPI / Swagger UI (Guía 08) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# --- Parámetros del alojamiento, Ficha del Alojamiento Anexo A (Guía 09) ---
sga.alojamiento.umbral-edad-facturable=12
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
sga.alojamiento.tiempo-preparacion-horas=3
sga.alojamiento.hora-limite-no-show=22:00
