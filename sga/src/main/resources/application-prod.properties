spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.show-sql=false
sga.seguridad.herramientas-desarrollo=false
sga.usuarios-iniciales.habilitados=false

sga.cors.allowed-origins=${SGA_CORS_ALLOWED_ORIGINS:}
sga.jwt.secret=${SGA_JWT_SECRET}

# En este perfil la cuenta inicial solo se crea al habilitarla y configurar sus datos.
sga.usuarios-iniciales.usuarios[0].nombre=Administrador SGA
sga.usuarios-iniciales.usuarios[0].correo=${SGA_ADMIN_CORREO:}
sga.usuarios-iniciales.usuarios[0].contrasena=${SGA_ADMIN_CONTRASENA:}
sga.usuarios-iniciales.usuarios[0].telefono=${SGA_ADMIN_TELEFONO:}
sga.usuarios-iniciales.usuarios[0].documento=${SGA_ADMIN_DOCUMENTO:}
sga.usuarios-iniciales.usuarios[0].fecha-nacimiento=${SGA_ADMIN_FECHA_NACIMIENTO:}
sga.usuarios-iniciales.usuarios[0].rol=ADMINISTRADOR
