# --- Diseño de la API (Guía 07), actualizado con los endpoints implementados (Guía 08) ---
openapi: 3.1.0

info:
  title: API SGA — SGA La Marteja
  description: |
    API RESTful del Sistema de Gestión de Alojamiento SGA La Marteja.

    **Agregado principal:** Reserva

    Convención de errores (Guía 07, 4.6): `400` el mensaje está mal escrito,
    `404` el identificador no existe, `409` una regla del negocio lo impide.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo local

tags:
  - name: Reservas
    description: Ciclo de vida del agregado Reserva

paths:

  # ==================== RESERVAS ====================

  /api/reservas:
    post:
      tags: [Reservas]
      summary: Crear una reserva
      description: |
        Crea la reserva en estado PENDIENTE, congela valor y política (RN-22) y abre su folio (F-08).
        Mapea a: `CrearReservaUseCase`
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
            example:
              identificacionApartamento: APT-301
              fechaEntrada: '2026-11-20'
              fechaSalida: '2026-11-22'
              canalOrigen: PORTAL
              horaEstimadaLlegada: '16:30'
              titular:
                documento: '1094123456'
                nombre: Ana Ramírez
                fechaNacimiento: '1990-05-12'
              ocupantes:
                - documento: '1094123456'
                  nombre: Ana Ramírez
                  fechaNacimiento: '1990-05-12'
                - documento: TI1030998877
                  nombre: Sofía Ramírez
                  fechaNacimiento: '2019-03-02'
      responses:
        '201':
          description: Reserva creada
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
                example: http://localhost:8080/api/reservas/RES-2026-00001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

    get:
      tags: [Reservas]
      summary: Listar reservas por estado
      description: |
        Mapea a: `ConsultarReservasPorEstadoUseCase`.
        La paginación de 10 por página (12.4) llega en la Guía 11.
      operationId: listarReservas
      parameters:
        - name: estado
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EstadoReserva'
      responses:
        '200':
          description: Reservas en el estado indicado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResumenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /api/reservas/{codigo}:
    get:
      tags: [Reservas]
      summary: Consultar una reserva
      description: 'Mapea a: `ConsultarReservaUseCase`'
      operationId: obtenerReserva
      parameters:
        - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Detalle de la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/reservas/{codigo}/confirmar:
    put:
      tags: [Reservas]
      summary: Confirmar una reserva
      description: |
        Mapea a: `ConfirmarReservaUseCase`. No recibe cuerpo.

        **Precondiciones:** la reserva está PENDIENTE (RN-08) y tiene hora estimada de llegada (RN-09).
      operationId: confirmarReserva
      parameters:
        - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Reserva confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/cancelar:
    put:
      tags: [Reservas]
      summary: Cancelar una reserva
      description: |
        Mapea a: `CancelarReservaUseCase`. La retención se calcula con la política congelada
        en la reserva (RN-13) y las noches se liberan de inmediato (RN-12).

        **Precondiciones:** la reserva está PENDIENTE o CONFIRMADA, antes del registro (7.5).
      operationId: cancelarReserva
      parameters:
        - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarReservaRequest'
            example:
              motivo: El titular cambió de planes
      responses:
        '200':
          description: Reserva cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

components:

  parameters:
    CodigoReserva:
      name: codigo
      in: path
      required: true
      description: Código de negocio de la reserva
      schema:
        type: string
        example: RES-2026-00001

  schemas:

    # ---------- Request ----------
    CrearReservaRequest:
      type: object
      required: [identificacionApartamento, fechaEntrada, fechaSalida, canalOrigen, titular, ocupantes]
      properties:
        identificacionApartamento:
          type: string
          example: APT-301
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        horaEstimadaLlegada:
          type: string
          format: time
          description: Opcional al crear; obligatoria para confirmar (RN-09)
        titular:
          $ref: '#/components/schemas/OcupanteRequest'
        ocupantes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OcupanteRequest'

    OcupanteRequest:
      type: object
      required: [documento, nombre, fechaNacimiento]
      properties:
        documento:
          type: string
          description: Solo letras y números
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date
          description: Se envía la fecha, nunca la edad (3.2)

    CancelarReservaRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 300

    # ---------- Response ----------
    ReservaDetalleResponse:
      type: object
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        noches:
          type: integer
        horaEstimadaLlegada:
          type: [string, 'null']
          format: time
          description: null hasta que se registre (RN-09)
        titular:
          $ref: '#/components/schemas/OcupanteResponse'
        ocupantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteResponse'
        totalOcupantes:
          type: integer
        valorTotal:
          type: integer
          format: int64
          description: Pesos colombianos, sin decimales (3.4)
        moneda:
          type: string
          example: COP
        versionPoliticaCancelacion:
          type: string
          description: La versión congelada en la reserva (RN-22)
        fechaCreacion:
          type: string
          format: date
        motivoCancelacion:
          type: [string, 'null']
          description: Solo si la reserva fue cancelada

    ReservaResumenResponse:
      type: object
      properties:
        codigo:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        nombreTitular:
          type: string
        totalOcupantes:
          type: integer
        valorTotal:
          type: integer
          format: int64

    OcupanteResponse:
      type: object
      properties:
        documento:
          type: string
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date

    # ---------- Enumeraciones del dominio ----------
    EstadoReserva:
      type: string
      enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]

    CanalOrigen:
      type: string
      enum: [PORTAL, DIRECTO, EXTERNO]

    # ---------- Error ----------
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        mensaje:
          type: string
          description: Mensaje con significado de negocio, nunca una traza técnica
        path:
          type: string
        errores:
          type: [object, 'null']
          description: Solo en un 400 de Bean Validation (campo → mensaje)
          additionalProperties:
            type: string

  responses:
    DatosInvalidos:
      description: La petición no cumple el formato esperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-10-18T15:21:40.107Z'
            status: 400
            error: Bad Request
            mensaje: La petición tiene datos inválidos
            path: /api/reservas
            errores:
              fechaEntrada: La fecha de entrada es obligatoria
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReglaDeNegocio:
      description: La operación viola una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-10-18T15:21:40.107Z'
            status: 409
            error: Conflict
            mensaje: El apartamento no está disponible para la estancia solicitada.
            path: /api/reservas
            errores: null

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
